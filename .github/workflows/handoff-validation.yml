name: Handoff validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handoff-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tools ship into repositories on every platform, and several past
        # defects were platform-specific (shell-less launch, process cleanup).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Tool tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Handoff structure
        run: python scripts/validate_handoffs.py --quiet
